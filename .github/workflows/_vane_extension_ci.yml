name: Vane extension CI

on:
  workflow_call:
    inputs:
      ci_tools_version:
        description: Exact commit used by the caller's vane-extension-ci-tools submodule
        required: true
        type: string
      manifest:
        description: Manifest path relative to the extension repository
        required: false
        default: vane-extension.toml
        type: string
      python_version:
        description: Python used for orchestration
        required: false
        default: "3.12"
        type: string
      build_jobs:
        description: Native and wheel compile parallelism
        required: false
        default: 8
        type: number
      run_native_tests:
        description: Run the manifest's native DuckDB test selection
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  verify_workflow:
    name: Verify pinned Vane CI workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VANE_EXTENSION_ROOT: ${{ github.workspace }}/extension
      VANE_MANIFEST: ${{ github.workspace }}/extension/${{ inputs.manifest }}
      VANE_CI_TOOLS_VERSION: ${{ inputs.ci_tools_version }}

    steps:
      - name: Checkout extension without submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: extension
          persist-credentials: false

      - name: Verify caller CI-tools pin
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VANE_CI_TOOLS_VERSION" =~ ^[0-9a-f]{40}$ ]]
          entry="$(git -C extension ls-tree HEAD -- vane-extension-ci-tools)"
          read -r mode type actual path <<< "$entry"
          test "$mode" = "160000"
          test "$type" = "commit"
          test "$path" = "vane-extension-ci-tools"
          test "$actual" = "$VANE_CI_TOOLS_VERSION"

      - name: Checkout exact official Vane CI tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: AstroVela/vane-extension-ci-tools
          ref: ${{ inputs.ci_tools_version }}
          path: ci-tools
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Verify exact official Vane CI tools
        shell: bash
        env:
          VANE_REUSABLE_WORKFLOW_REF: ${{ job.workflow_ref }}
          VANE_REUSABLE_WORKFLOW_SHA: ${{ job.workflow_sha }}
          VANE_REUSABLE_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          expected_workflow_ref="AstroVela/vane-extension-ci-tools/.github/workflows/_vane_extension_ci.yml@$VANE_CI_TOOLS_VERSION"
          test "$VANE_REUSABLE_WORKFLOW_REPOSITORY" = "AstroVela/vane-extension-ci-tools"
          test "$VANE_REUSABLE_WORKFLOW_REF" = "$expected_workflow_ref"
          test "$VANE_REUSABLE_WORKFLOW_SHA" = "$VANE_CI_TOOLS_VERSION"
          python ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            verify-ci-tools \
            --ci-tools-source ci-tools \
            --expected-sha "$VANE_CI_TOOLS_VERSION"

  native:
    name: Vane DuckDB native extension
    needs: verify_workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      VANE_EXTENSION_ROOT: ${{ github.workspace }}/extension
      VANE_MANIFEST: ${{ github.workspace }}/extension/${{ inputs.manifest }}
      VANE_SOURCE_DIR: ${{ github.workspace }}/vane
      VANE_NATIVE_BUILD_DIR: ${{ github.workspace }}/build/vane-native
      VANE_BUILD_JOBS: ${{ inputs.build_jobs }}
      VANE_CI_TOOLS_VERSION: ${{ inputs.ci_tools_version }}
      VCPKG_TARGET_TRIPLET: x64-linux
      CCACHE_DIR: ${{ github.workspace }}/.cache/vane-native-ccache
      CCACHE_MAXSIZE: 750M
      CCACHE_COMPILERCHECK: content
      VANE_CMAKE_COMPILER_LAUNCHER: ccache

    steps:
      - name: Checkout extension and submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: extension
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify pinned Vane CI tools
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VANE_CI_TOOLS_VERSION" =~ ^[0-9a-f]{40}$ ]]
          actual="$(git -C extension/vane-extension-ci-tools rev-parse HEAD)"
          test "$actual" = "$VANE_CI_TOOLS_VERSION"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Read integration manifest
        id: manifest
        run: |
          python extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            manifest \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Vane identity
        run: |
          python extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            identity \
            --vane-source "$VANE_SOURCE_DIR"

      - name: Install CMake, Ninja, and ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          python -m pip install "cmake>=3.29" "ninja>=1.10"

      - name: Restore Vane native compiler cache
        id: native_ccache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: vane-native-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_TARGET_TRIPLET }}-${{ steps.manifest.outputs.vane_revision }}-${{ steps.manifest.outputs.vcpkg_revision }}

      - name: Reset Vane native compiler cache statistics
        shell: bash
        run: |
          set -euo pipefail
          ccache --zero-stats

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ steps.manifest.outputs.vcpkg_revision }}
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Build and test extension against Vane DuckDB
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          VANE_SKIP_NATIVE_TESTS: ${{ inputs.run_native_tests && '0' || '1' }}
        run: |
          make -f extension/vane-extension-ci-tools/makefiles/vane_extension.Makefile \
            vane_ci \
            VANE_EXTENSION_ROOT="$VANE_EXTENSION_ROOT" \
            VANE_MANIFEST="$VANE_MANIFEST" \
            VANE_SOURCE_DIR="$VANE_SOURCE_DIR" \
            VANE_NATIVE_BUILD_DIR="$VANE_NATIVE_BUILD_DIR" \
            VANE_BUILD_JOBS="$VANE_BUILD_JOBS" \
            VANE_SKIP_NATIVE_TESTS="$VANE_SKIP_NATIVE_TESTS"

      - name: Report Vane native compiler cache
        if: always()
        shell: bash
        env:
          VANE_CCACHE_ACTION_HIT: ${{ steps.native_ccache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          printf 'GitHub Actions ccache restore hit: %s\n' "${VANE_CCACHE_ACTION_HIT:-false}"
          ccache --show-stats

  wheel:
    name: Vane wheel with linked extension
    needs: verify_workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      VANE_EXTENSION_ROOT: ${{ github.workspace }}/extension
      VANE_MANIFEST: ${{ github.workspace }}/extension/${{ inputs.manifest }}
      VANE_SOURCE_DIR: ${{ github.workspace }}/vane
      VANE_WHEEL_BUILD_DIR: ${{ github.workspace }}/build/vane-wheel
      VANE_WHEEL_DIST_DIR: ${{ github.workspace }}/build/vane-wheel/dist
      VANE_VCPKG_ROOT: ${{ github.workspace }}/vane-vcpkg
      VANE_VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vane/vcpkg_installed
      VANE_BUILD_JOBS: ${{ inputs.build_jobs }}
      VANE_CI_TOOLS_VERSION: ${{ inputs.ci_tools_version }}
      VCPKG_TARGET_TRIPLET: x64-linux
      CCACHE_DIR: ${{ github.workspace }}/.cache/vane-wheel-ccache
      CCACHE_MAXSIZE: 750M
      CCACHE_COMPILERCHECK: content
      VANE_CMAKE_COMPILER_LAUNCHER: ccache

    steps:
      - name: Checkout extension and submodules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: extension
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify pinned Vane CI tools
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VANE_CI_TOOLS_VERSION" =~ ^[0-9a-f]{40}$ ]]
          actual="$(git -C extension/vane-extension-ci-tools rev-parse HEAD)"
          test "$actual" = "$VANE_CI_TOOLS_VERSION"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Read integration manifest
        id: manifest
        run: |
          python extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            manifest \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact Vane source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.manifest.outputs.vane_repository }}
          ref: ${{ steps.manifest.outputs.vane_revision }}
          path: vane
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Vane identity
        run: |
          python extension/vane-extension-ci-tools/scripts/vane_extension.py \
            --manifest "$VANE_MANIFEST" \
            --extension-root "$VANE_EXTENSION_ROOT" \
            identity \
            --vane-source "$VANE_SOURCE_DIR"

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            libtool \
            ninja-build \
            pkg-config \
            tar \
            unzip \
            zip

      - name: Install wheel build tools
        run: >-
          python -m pip install
          build
          "cmake>=3.29"
          "ninja>=1.10"
          "pybind11[global]>=3.0.0"
          "scikit-build-core>=0.11.4"
          "setuptools-scm>=9.2.0"

      - name: Restore Vane wheel compiler cache
        id: wheel_ccache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: vane-wheel-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_TARGET_TRIPLET }}-${{ steps.manifest.outputs.vane_revision }}-${{ steps.manifest.outputs.vcpkg_revision }}

      - name: Reset Vane wheel compiler cache statistics
        shell: bash
        run: |
          set -euo pipefail
          ccache --zero-stats

      - name: Set up extension vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ steps.manifest.outputs.vcpkg_revision }}
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Build and verify extension-bearing Vane wheel
        env:
          VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          VCPKG_MAX_CONCURRENCY: ${{ inputs.build_jobs }}
        run: |
          make -f extension/vane-extension-ci-tools/makefiles/vane_extension.Makefile \
            vane_wheel \
            VANE_EXTENSION_ROOT="$VANE_EXTENSION_ROOT" \
            VANE_MANIFEST="$VANE_MANIFEST" \
            VANE_SOURCE_DIR="$VANE_SOURCE_DIR" \
            VANE_WHEEL_BUILD_DIR="$VANE_WHEEL_BUILD_DIR" \
            VANE_WHEEL_DIST_DIR="$VANE_WHEEL_DIST_DIR" \
            VANE_VCPKG_ROOT="$VANE_VCPKG_ROOT" \
            VANE_VCPKG_INSTALLED_DIR="$VANE_VCPKG_INSTALLED_DIR" \
            VANE_BUILD_JOBS="$VANE_BUILD_JOBS" \
            VCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET"

      - name: Report Vane wheel compiler cache
        if: always()
        shell: bash
        env:
          VANE_CCACHE_ACTION_HIT: ${{ steps.wheel_ccache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          printf 'GitHub Actions ccache restore hit: %s\n' "${VANE_CCACHE_ACTION_HIT:-false}"
          ccache --show-stats

      - name: Upload verified Vane wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vane-${{ steps.manifest.outputs.extension_name }}-wheel
          path: ${{ env.VANE_WHEEL_DIST_DIR }}/*.whl
          if-no-files-found: error
